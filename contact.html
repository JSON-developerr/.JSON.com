
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Tabs - .Json</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        /* MAIN CONTAINER */

        .menu {
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TITLE */

        .title {
            color: #ffffff;
            font-size: 23px;
            font-weight: normal;
            margin-bottom: 20px;
            text-align: center;
        }

        /* LINKS */

        .tabs {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tab {
            width: 100%;
            height: 48px;

            background: #252525;
            border: 1px solid #333333;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ffffff;
            font-size: 16px;
            text-decoration: none;

            transition: background 0.15s ease;
        }

        .tab:hover {
            background: #383838;
        }

    </style>
</head>

<body>

    <div class="menu">

        <div class="title">Website Tabs</div>

        <div class="tabs">

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/index.html">
                Home
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/blog.html">
                Blog
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/about.html">
                About
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/games.html">
                Games
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/Presentation.html">
                Presentations
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/Drawing.html">
                Drawings
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/theroom.html">
                Json's Room
            </a>

            <a class="tab" href="https://json-developerr.github.io/.JSON.com/anend.html">
                The Archives
            </a>

        </div>

    </div>

</body>
</html>
