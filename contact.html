
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter Code - .Json</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .message {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .submessage {
            color: #ffffff;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .code-box {
            width: 220px;
            height: 65px;
            background: #252525;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #333333;
        }

        .code-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 8px;
        }

        .code-input::placeholder {
            color: #555555;
        }

        .submit-button {
            width: 220px;
            height: 40px;
            margin-top: 12px;
            background: #252525;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 13px;
            font-family: Arial, Helvetica, sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-button:hover {
            background: #353535;
        }

        .error {
            color: #ff3333;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        /* SENT SCREEN */

        #sentScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            font-family: Arial, Helvetica, sans-serif;
        }

    </style>

</head>

<body>

    <div class="container" id="mainContainer">

        <div class="message">
            If you'd like, leave your email here.
        </div>

        <div class="submessage">
            I'll make sure something finds its way to you.
        </div>

        <form id="codeForm">

            <div class="code-box">

                <input
                    class="code-input"
                    id="codeInput"
                    type="text"
                    placeholder="Email"
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>

            <button class="submit-button" type="submit">
                Submit
            </button>

            <div class="error" id="errorMessage">
                Theres no entry
            </div>

        </form>

    </div>

    <!-- SENT SCREEN -->

    <div id="sentScreen">
        Sent
    </div>

    <script>

        const form = document.getElementById("codeForm");
        const input = document.getElementById("codeInput");
        const error = document.getElementById("errorMessage");

        const mainContainer = document.getElementById("mainContainer");
        const sentScreen = document.getElementById("sentScreen");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const text = input.value.trim();

            // EMPTY INPUT

            if (text === "") {

                error.style.display = "block";
                return;

            }

            // HIDE ERROR

            error.style.display = "none";

            // PREPARE EMAIL

            const subject = "You've got mail";

            const message =
                "https://json-developerr.github.io/.JSON.com/anend.html";

            const mailto =
                "mailto:" + encodeURIComponent(text) +
                "?subject=" + encodeURIComponent(subject) +
                "&body=" + encodeURIComponent(message);

            // SHOW SENT SCREEN

            mainContainer.style.display = "none";
            sentScreen.style.display = "flex";

            // OPEN EMAIL APPLICATION

            window.location.href = mailto;

            // REDIRECT AFTER 3 SECONDS

            setTimeout(function() {

                window.location.href =
                    "https://json-developerr.github.io/.JSON.com/index.html";

            }, 3000);

        });

        // HIDE ERROR WHEN TYPING

        input.addEventListener("input", function() {
            error.style.display = "none";
        });

    </script>

</body>

</html>
