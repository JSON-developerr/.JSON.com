
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Json's Room - .Json</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        .room-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;

            cursor: pointer;
            -webkit-user-drag: none;
        }

    </style>

</head>

<body>

    <!-- ROOM IMAGE -->

    <img
        class="room-image"
        src="jsonsroom.png"
        alt="Json's Room"
        draggable="false"
    >

    <!-- BACKGROUND MUSIC -->

    <audio
        id="backgroundMusic"
        src="jsonsroomaudio.mp3"
        loop
        autoplay
    ></audio>


    <script>

        // =====================================
        // BACKGROUND MUSIC
        // =====================================

        const music = document.getElementById("backgroundMusic");

        music.volume = 1.0;

        function startMusic() {
            music.play().catch(() => {});
        }

        startMusic();

        document.addEventListener("pointerdown", startMusic, {
            once: true
        });


        // =====================================
        // RADIO REDIRECT
        // =====================================

        const radioURL =
            "https://json-developerr.github.io/.JSON.com/radio.html";

        const HOLD_TIME = 2000;

        let holdTimer = null;
        let isHolding = false;
        let isRedirecting = false;


        // =====================================
        // START HOLD
        // =====================================

        function startHold(event) {

            if (isRedirecting || isHolding) return;

            if (event.button !== undefined && event.button !== 0) {
                return;
            }

            isHolding = true;

            holdTimer = window.setTimeout(function() {

                isRedirecting = true;

                window.location.assign(radioURL);

            }, HOLD_TIME);

        }


        // =====================================
        // CANCEL HOLD
        // =====================================

        function cancelHold() {

            if (!isHolding || isRedirecting) return;

            isHolding = false;

            if (holdTimer !== null) {

                clearTimeout(holdTimer);

                holdTimer = null;

            }

        }


        // =====================================
        // INPUT EVENTS
        // =====================================

        document.addEventListener("pointerdown", startHold);

        document.addEventListener("pointerup", cancelHold);

        document.addEventListener("pointercancel", cancelHold);

        document.addEventListener("mouseup", cancelHold);

        document.addEventListener("touchend", cancelHold);

        document.addEventListener("touchcancel", cancelHold);


        // =====================================
        // PREVENT UNWANTED ACTIONS
        // =====================================

        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });

        document.addEventListener("dragstart", function(event) {
            event.preventDefault();
        });

    </script>

</body>

</html>
