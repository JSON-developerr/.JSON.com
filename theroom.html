
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Json's Room - .Json</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            /* Prevent selection and mobile gestures */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        /* CENTER IMAGE */

        .room-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;

            cursor: pointer;
            -webkit-user-drag: none;
        }

    </style>

</head>

<body>

    <!-- CENTER IMAGE -->

    <img
        class="room-image"
        src="jsonsroom.png"
        alt="Json's Room"
        draggable="false"
    >

    <!-- BACKGROUND MUSIC -->

    <audio
        id="backgroundMusic"
        src="jsonsroomaudio.mp3"
        loop
        autoplay
    ></audio>

    <script>

        // =====================================
        // BACKGROUND MUSIC
        // =====================================

        const music = document.getElementById("backgroundMusic");

        music.volume = 1.0;

        music.play().catch(() => {

            document.addEventListener("pointerdown", () => {
                music.play();
            }, { once: true });

        });


        // =====================================
        // RADIO ACCESS
        // =====================================

        const radioURL =
            "https://json-developerr.github.io/.JSON.com/radio.html";

        const holdDuration = 2000;

        let holdTimer = null;
        let isHolding = false;
        let isRedirecting = false;


        function startHold() {

            if (isHolding || isRedirecting) return;

            isHolding = true;

            holdTimer = setTimeout(() => {

                isRedirecting = true;

                window.location.href = radioURL;

            }, holdDuration);

        }


        function cancelHold() {

            if (!isHolding || isRedirecting) return;

            isHolding = false;

            clearTimeout(holdTimer);

            holdTimer = null;

        }


        // Mouse and touch support

        document.addEventListener("pointerdown", (event) => {

            if (event.button !== 0) return;

            startHold();

        });

        document.addEventListener("pointerup", cancelHold);

        document.addEventListener("pointerleave", cancelHold);

        document.addEventListener("pointercancel", cancelHold);


        // Prevent context menu

        document.addEventListener("contextmenu", (event) => {
            event.preventDefault();
        });


        // Prevent dragging

        document.addEventListener("dragstart", (event) => {
            event.preventDefault();
        });

    </script>

</body>

</html>
