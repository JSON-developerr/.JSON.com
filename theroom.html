
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Json's Room - .Json</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CENTER IMAGE */

        .room-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

    </style>

</head>

<body>

    <!-- CENTER IMAGE -->

    <img
        class="room-image"
        src="jsonsroom.png"
        alt="Json's Room"
    >

    <!-- BACKGROUND MUSIC -->

    <audio
        id="backgroundMusic"
        src="jsonsroomaudio.mp3"
        loop
        autoplay
    ></audio>

    <script>

        // Attempt to start background music

        const music = document.getElementById("backgroundMusic");

        music.volume = 1.0;

        music.play().catch(() => {
            // Browser may block autoplay.
            // Music can start after the first user interaction.

            document.addEventListener("click", () => {
                music.play();
            }, { once: true });

            document.addEventListener("keydown", () => {
                music.play();
            }, { once: true });
        });

    </script>

</body>

</html>
