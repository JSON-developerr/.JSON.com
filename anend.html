
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Helps prevent old cached versions -->
    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>.Json</title>

    <style>

        /* =========================================
           COLORS / SIZES
        ========================================= */

        :root {

            /* PAGE */
            --background-color: #e9e7e2;
            --text-color: #35332f;

            /* TOP BAR */
            --bar-color: #898087;
            --bar-text-color: #eeece9;

            --bar-height: 72px;

            /* LINKS */
            --link-color: #78858b;

            /* BUTTON */
            --button-color: #898087;
            --button-text-color: #eeece9;

            /* MAIN CONTENT */
            --content-width: 800px;
            --image-height: 300px;

        }


        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color:
                var(--background-color);

            color:
                var(--text-color);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            display: block;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {

            width: 100%;

            height:
                var(--bar-height);

            background-color:
                var(--bar-color);

            display: flex;

            align-items: center;

            position: relative;

            z-index: 100;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .nav-container {

            width: 92%;

            max-width: 1050px;

            margin: 0 auto;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        /* =========================================
           WEBSITE NAME
        ========================================= */

        .site-name {

            color:
                var(--bar-text-color);

            font-size: 20px;

            font-weight: bold;

            user-select: none;
        }


        /* =========================================
           NAV LINKS
        ========================================= */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 34px;
        }

        .nav-links a {

            color:
                var(--bar-text-color);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 0;

            border-bottom:
                2px solid transparent;

            transition:
                opacity 0.15s,
                border-color 0.15s;
        }

        .nav-links a:hover {

            opacity: 0.8;

            border-bottom-color:
                var(--bar-text-color);
        }

        /* HOME IS NOT CLICKABLE */

        .nav-home {

            color:
                var(--bar-text-color);

            font-size: 14px;

            padding: 8px 0;

            user-select: none;
        }


        /* =========================================
           MAIN CONTENT
        ========================================= */

        .home-main {

            width: 92%;

            max-width:
                var(--content-width);

            margin:
                0 auto;

            padding:
                45px 0 100px;
        }


        /* =========================================
           HERO IMAGE
        ========================================= */

        .hero-image {

            width: 100%;

            height:
                var(--image-height);

            border:
                3px solid #77736e;

            overflow: hidden;

            background-color:
                #d6d3cc;
        }

        .hero-image img {

            display: block;

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        /* =========================================
           HOME INFORMATION
        ========================================= */

        .home-info {

            margin-top:
                25px;
        }

        .home-text {

            font-size:
                16px;

            line-height:
                1.55;
        }

        .home-text h1 {

            margin:
                0 0 12px;

            font-size:
                30px;
        }

        .home-text p {

            margin:
                0 0 16px;
        }

        .home-text a {

            color:
                var(--link-color);

            text-decoration: none;
        }


        /* =========================================
           EXTRA SECTION
        ========================================= */

        .extra-section {

            margin-top:
                90px;

            text-align:
                center;
        }

        .extra-section h2 {

            font-size:
                26px;
        }


        /* =========================================
           BLOG BUTTON
        ========================================= */

        .blog-button {

            display:
                inline-block;

            margin-top:
                15px;

            padding:
                13px 28px;

            background-color:
                var(--button-color);

            color:
                var(--button-text-color);

            text-decoration:
                none;

            font-weight:
                bold;

            transition:
                opacity 0.15s,
                transform 0.15s;
        }

        .blog-button:hover {

            opacity:
                0.8;

            transform:
                translateY(-2px);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 750px) {

            .topbar {

                height:
                    auto;

                padding:
                    18px 0;
            }

            .nav-container {

                flex-direction:
                    column;

                gap:
                    15px;
            }

            .nav-links {

                gap:
                    25px;

                flex-wrap:
                    wrap;

                justify-content:
                    center;
            }

            .home-main {

                padding-top:
                    30px;
            }

            .hero-image {

                height:
                    230px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================= -->

    <header class="topbar">

        <div class="nav-container">

            <!-- WEBSITE NAME: NOT CLICKABLE -->

            <span class="site-name">
                .Json
            </span>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <!-- HOME: NOT CLICKABLE -->

                <span class="nav-home">
                    Home
                </span>


                <!-- BLOG -->

                <a href="https://json-developerr.github.io/.JSON.com/blogs.html">
                    Blog
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <main class="home-main">


        <!-- HERO IMAGE -->

        <div class="hero-image">

            <img
                src="images/homes.png"
                alt=".Json"
            >

        </div>



        <!-- HOME TEXT -->

        <div class="home-info">

            <div class="home-text">


                <p>
                  *
                    <br>
                  
                </p>

            </div>

        </div>



        <!-- =========================================
             LATEST STUFF
        ========================================= -->

        <section class="extra-section">

            <h2>
                Latest stuff
            </h2>

            <p>
                Check out development updates
                and other posts on my blog.
            </p>

            <a
                class="blog-button"
                href="https://json-developerr.github.io/.JSON.com/blogs.html"
            >
                GO TO BLOG
            </a>

        </section>


    </main>


</body>

</html>
