<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>October 2026 presentat.son - .Json</title>

    <style>
        :root {
            --background: #ffffff;
            --bar-color: #a545a5;
            --bar-text: #ffffff;
            --title-color: #ef5a5a;
            --text-color: #111111;
            --max-width: 900px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--background);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .topbar {
            width: 100%;
            min-height: 75px;
            background: var(--bar-color);
            display: flex;
            align-items: center;
        }

        .nav {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--bar-text);
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .links a {
            color: var(--bar-text);
            text-decoration: none;
            font-size: 15px;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        .links a:hover {
            opacity: 0.8;
            border-bottom-color: var(--bar-text);
        }

        .article {
            width: 92%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 70px 0 120px;
        }

        .article > h1 {
            margin: 0 0 15px;
            color: var(--title-color);
            font-size: 42px;
            line-height: 1.2;
        }

        .date {
            margin: 0 0 40px;
            font-weight: bold;
            opacity: 0.75;
        }

        .hero {
            display: block;
            width: 100%;
            max-height: 520px;
            object-fit: cover;
            margin: 0 0 45px;
            background: #eeeeee;
        }

        article {
            font-size: 17px;
            line-height: 1.8;
        }

        article p {
            margin: 0 0 25px;
            font-size: 17px;
            line-height: 1.8;
        }

        article h1, article h2 {
            margin: 55px 0 20px;
            color: var(--title-color);
            font-size: 28px;
            line-height: 1.2;
        }

        article img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 30px 0;
        }

        article audio {
            display: block;
            width: 100%;
            max-width: 800px;
            margin: 25px 0 35px;
        }

        article a { color: var(--title-color); }

        .audio-note {
            font-size: 14px;
            opacity: 0.75;
        }

        .back {
            display: inline-block;
            margin-top: 50px;
            color: var(--title-color);
            text-decoration: underline;
            font-size: 15px;
        }

        .back:hover { opacity: 0.7; }

        @media (max-width: 750px) {
            .topbar { padding: 20px 0; }
            .nav { flex-direction: column; gap: 15px; }
            .links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .article { padding-top: 45px; }
            .article > h1 { font-size: 34px; }
            article h1, article h2 { font-size: 26px; }
            article, article p { font-size: 16px; }
        }
    </style>
</head>
<body>

                <a href="Drawing.html">Drawings</a>
                <a href="https://charlieclip.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
            </nav>
        </div>
    </header>

</p>

</body>
</html>
