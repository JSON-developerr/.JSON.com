<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>October 2026 presentat.son - .Json</title>

    <style>
        :root {
            --background: #ffffff;
            --bar-color: #a545a5;
            --bar-text: #ffffff;
            --title-color: #ef5a5a;
            --text-color: #111111;
            --max-width: 900px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--background);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .topbar {
            width: 100%;
            min-height: 75px;
            background: var(--bar-color);
            display: flex;
            align-items: center;
        }

        .nav {
            width: 92%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: var(--bar-text);
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .links a {
            color: var(--bar-text);
            text-decoration: none;
            font-size: 15px;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }

        .links a:hover {
            opacity: 0.8;
            border-bottom-color: var(--bar-text);
        }

        .page-main {
            width: 92%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 45px 0 100px;
        }

        .page-main > h1 {
            margin: 0 0 25px;
            color: var(--title-color);
            font-size: 36px;
        }

        .video-container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto 45px;
        }

        .video-container iframe {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: none;
        }

        .game-embeds {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            margin: 35px auto;
        }

        .game-embeds iframe {
            display: block;
            width: 100%;
            max-width: 552px;
            border: 0;
        }

        .back {
            display: inline-block;
            margin-top: 35px;
            color: var(--title-color);
            text-decoration: underline;
            font-size: 15px;
        }

        .back:hover { opacity: 0.7; }

        @media (max-width: 750px) {
            .topbar { padding: 20px 0; }
            .nav { flex-direction: column; gap: 15px; }
            .links { flex-wrap: wrap; justify-content: center; gap: 20px; }
            .page-main { padding-top: 30px; }
            .page-main > h1 { font-size: 30px; }
            .game-embeds iframe { max-width: 100%; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="nav">
            <a href="index.html" class="logo">.Json</a>
            <nav class="links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
                <a href="games.html">Games</a>
                <a href="Presentation.html">Presentations</a>
                <a href="Drawing.html">Drawings</a>
                <a href="https://charlieclip.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <hr>
        <h1>October 2026</h1>

        <div class="video-container">
            <iframe
                src="https://player.vimeo.com/video/1238096517"
                title="October 2026 Video"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <section class="game-embeds" aria-label="Featured games">
            <iframe
                frameborder="0"
                src="https://itch.io/embed/4721717?bg_color=23503c&amp;fg_color=ffffff&amp;link_color=5ba3fa&amp;border_color=000000"
                width="552"
                height="167"
                title="Hollow Knight: Together on itch.io">
                <a href="https://json-dev.itch.io/hollow-knight-together">Hollow Knight: Together by .JSON</a>
            </iframe>

            <iframe
                frameborder="0"
                src="https://itch.io/embed/4876236?bg_color=141414&amp;fg_color=ffffff&amp;link_color=360a0a&amp;border_color=000000"
                width="552"
                height="167"
                title="Floodgate on itch.io">
                <a href="https://json-dev.itch.io/floodgate">Floodgate by .JSON</a>
            </iframe>
        </section>

        <a class="back" href="blog.html">&#8592; Back to Blog</a>
    </main>
</body>
</html>
