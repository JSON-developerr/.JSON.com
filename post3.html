<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>test page - .Json</title>


    <style>

        :root {
            --background: #ffffff;
            --text-color: #111111;

            --bar-color: #a545a5;
            --bar-text: #ffffff;

            --title-color: #ef5a5a;

            --max-width: 900px;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            background:
                var(--background);

            color:
                var(--text-color);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================
           TOP BAR
           ===================================== */

        .topbar {
            width: 100%;
            height: 75px;

            background:
                var(--bar-color);

            display: flex;
            align-items: center;
        }


        .nav {
            width: 92%;
            max-width: 1100px;

            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            color:
                var(--bar-text);

            text-decoration: none;

            font-size: 24px;
            font-weight: bold;
        }


        .links {
            display: flex;

            gap: 35px;

            align-items: center;
        }


        .links a {
            color:
                var(--bar-text);

            text-decoration: none;

            font-size: 15px;
        }


        .links a:hover {
            text-decoration: underline;
        }


        /* =====================================
           ARTICLE
           ===================================== */

        .article {
            width: 92%;
            max-width:
                var(--max-width);

            margin:
                60px auto 120px;
        }


        /* =====================================
           IMAGE
           ===================================== */

        .article-image {
            width: 100%;

            margin-bottom: 35px;
        }


        .article-image img {
            display: block;

            width: 100%;

            max-height: 500px;

            object-fit: cover;
        }


        /* =====================================
           TITLE
           ===================================== */

        .article h1 {
            margin:
                0 0 10px;

            color:
                var(--title-color);

            font-size: 42px;

            line-height: 1.2;
        }


        .date {
            margin-bottom: 35px;

            font-weight: bold;
        }


        /* =====================================
           TEXT
           ===================================== */

        .article-text {
            font-size: 17px;

            line-height: 1.8;
        }


        .article-text p {
            margin-bottom: 24px;
        }


        .article-text h2 {
            margin-top: 45px;

            font-size: 28px;
        }


        /* =====================================
           BACK BUTTON
           ===================================== */

        .back-button {
            display: inline-block;

            margin-top: 40px;

            padding:
                13px 25px;

            background:
                var(--bar-color);

            color:
                var(--bar-text);

            text-decoration: none;

            font-weight: bold;
        }


        .back-button:hover {
            opacity: 0.8;
        }


        /* =====================================
           MOBILE
           ===================================== */

        @media (max-width: 750px) {

            .topbar {
                height: auto;

                padding:
                    20px 0;
            }


            .nav {
                flex-direction: column;

                gap: 15px;
            }


            .links {
                flex-wrap: wrap;

                justify-content: center;

                gap: 20px;
            }


            .article {
                margin-top: 35px;
            }


            .article h1 {
                font-size: 32px;
            }


            .article-text {
                font-size: 16px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================
         TOP BAR
         ===================================== -->

    <header class="topbar">

        <div class="nav">

            <a
                href="index.html"
                class="logo"
            >
                .Json
            </a>


            <div class="links">

                <a href="index.html">
                    Home
                </a>

                <a href="blog.html">
                    Blog
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="games.html">
                    Games
                </a>

                <a href="Presentation.html">
                    Presentations
                </a>

                <a href="Drawing.html">
                    Drawings
                </a>

                <a
                    href="https://charlieclip.itch.io/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    itch.io
                </a>

            </div>

        </div>

    </header>



    <!-- =====================================
         FULL BLOG POST
         ===================================== -->

    <main class="article">


        <!-- BIG IMAGE -->

        <div class="article-image">

            <img
                src="images/post3.png"
                alt="Blog post image"
            >

        </div>


        <!-- TITLE -->

        <h1>
            Title
        </h1>


        <!-- DATE -->

        <p class="date">
            8/15/26
        </p>


        <!-- =================================
             ALL YOUR TEXT GOES HERE
             ================================= -->

        <div class="article-text">

            <p>
                Im testing the blog posts
            </p>



            <a
                class="back-button"
                href="blog.html"
            >
                BACK TO BLOG
            </a>

        </div>

    </main>


</body>

</html>
