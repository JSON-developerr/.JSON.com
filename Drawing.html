<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Helps prevent old cached versions -->
    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>Drawings - .Json</title>


    <style>

        :root {

            --background-color: #ffffff;
            --text-color: #111111;

            --bar-color: #a545a5;
            --bar-text-color: #ffffff;

            --bar-height: 72px;

            --content-width: 800px;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background-color:
                var(--background-color);

            color:
                var(--text-color);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            display: block;
        }


        .topbar {

            width: 100%;

            height:
                var(--bar-height);

            background-color:
                var(--bar-color);

            display: flex;

            align-items: center;

            position: relative;

            z-index: 100;
        }


        .nav-container {

            width: 92%;

            max-width: 1050px;

            margin: 0 auto;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .site-name {

            color:
                var(--bar-text-color);

            text-decoration: none;

            font-size: 20px;

            font-weight: bold;
        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 34px;
        }


        .nav-links a {

            color:
                var(--bar-text-color);

            text-decoration: none;

            font-size: 14px;

            padding: 8px 0;

            border-bottom:
                2px solid transparent;

            transition:
                opacity 0.15s,
                border-color 0.15s;
        }


        .nav-links a:hover {

            opacity: 0.8;

            border-bottom-color:
                var(--bar-text-color);
        }


        .nav-links a.active {

            border-bottom-color:
                var(--bar-text-color);
        }


        .page-main {

            width: 92%;

            max-width:
                var(--content-width);

            margin:
                0 auto;

            padding:
                45px 0 100px;
        }


        .page-main h1 {

            margin: 0;

            font-size: 30px;
        }


        @media (max-width: 750px) {

            .topbar {

                height:
                    auto;

                padding:
                    18px 0;
            }


            .nav-container {

                flex-direction:
                    column;

                gap:
                    15px;
            }


            .nav-links {

                gap:
                    20px;

                flex-wrap:
                    wrap;

                justify-content:
                    center;
            }


            .page-main {

                padding-top:
                    30px;
            }
        }

    </style>

</head>


<body>


    <header class="topbar">

        <div class="nav-container">


            <a
                class="site-name"
                href="index.html"
            >
                .Json
            </a>


            <nav class="nav-links">


                <a href="index.html">
                    Home
                </a>


                <a href="blog.html">
                    Blog
                </a>


                <a href="about.html">
                    About
                </a>


                <a href="games.html">
                    Games
                </a>


                <a href="Presentation.html">
                    Presentations
                </a>


                <a
                    href="Drawing.html"
                    class="active"
                >
                    Rants
                </a>


                <a
                    href="https://charlieclip.itch.io/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    itch.io
                </a>


            </nav>

        </div>

    </header>


    <main class="page-main">

                                            <p>
                                                Nothing here yet :P
                                            <p>



    </main>


</body>

</html>
