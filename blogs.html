
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog - .Json</title>

    <style>

        /* =========================================
           COLORS / SIZES
        ========================================= */

        :root {
            --background: #e9e7e2;
            --bar-color: #898087;
            --bar-text: #eeece9;
            --post-title: #898087;
            --text-color: #35332f;
            --link-color: #78858b;
            --max-width: 1100px;
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: var(--background);
            color: var(--text-color);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
        }


        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {
            width: 100%;
            min-height: 75px;

            background: var(--bar-color);

            display: flex;
            align-items: center;

            position: relative;
            z-index: 100;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .nav {
            width: 92%;
            max-width: var(--max-width);

            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        /* =========================================
           WEBSITE NAME
        ========================================= */

        .logo {
            color: var(--bar-text);

            text-decoration: none;

            font-size: 24px;
            font-weight: bold;
        }


        /* =========================================
           NAV LINKS
        ========================================= */

        .links {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .links a {
            color: var(--bar-text);

            text-decoration: none;

            font-size: 15px;

            padding: 8px 0;

            border-bottom: 2px solid transparent;

            transition:
                opacity 0.15s,
                border-color 0.15s;
        }

        .links a:hover {
            opacity: 0.8;

            border-bottom-color: var(--bar-text);
        }


        /* =========================================
           BLOG
        ========================================= */

        .blog {
            width: 92%;
            max-width: var(--max-width);

            margin: 0 auto;

            padding: 70px 0 100px;
        }


        /* =========================================
           BLOG POST
        ========================================= */

        .post-link {
            display: flex;
            align-items: center;

            gap: 60px;

            width: 100%;

            color: inherit;
            text-decoration: none;

            transition: opacity 0.15s;
        }

        .post-link:hover {
            opacity: 0.85;
        }


        /* =========================================
           BLACK IMAGE BOX
        ========================================= */

        .post-image {
            width: 50%;
            height: 340px;

            background: #000000;

            flex-shrink: 0;
        }


        /* =========================================
           POST TEXT
        ========================================= */

        .post-text {
            width: 50%;
        }

        .post-text h2 {
            margin: 0 0 20px;

            color: var(--post-title);

            font-size: 28px;

            line-height: 1.3;
        }

        .post-text p {
            font-size: 15px;

            line-height: 1.7;
        }

        .date {
            font-weight: bold;
        }

        .read-more {
            color: var(--link-color);

            text-decoration: underline;

            font-size: 14px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 750px) {

            .topbar {
                padding: 20px 0;
            }

            .nav {
                flex-direction: column;
                gap: 15px;
            }

            .links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 25px;
            }

            .blog {
                padding-top: 40px;
            }

            .post-link {
                flex-direction: column;
                gap: 30px;
            }

            .post-image,
            .post-text {
                width: 100%;
            }

            .post-image {
                height: 260px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         TOP BAR
    ===================================== -->

    <header class="topbar">

        <div class="nav">

            <!-- WEBSITE NAME -->

            <a
                href="https://json-developerr.github.io/.JSON.com/anend.html"
                class="logo"
            >
                .Json
            </a>


            <!-- NAVIGATION -->

            <nav class="links">

                <a href="https://json-developerr.github.io/.JSON.com/anend.html">
                    Home
                </a>

                <a href="https://json-developerr.github.io/.JSON.com/blogs.html">
                    Blog
                </a>

            </nav>

        </div>

    </header>





    <main class="blog">



        <a
            href="postM.html"
            class="post-link"
            aria-label="."
        >

            <!-- BLACK IMAGE BOX -->

            <div class="post-image"></div>


            <!-- POST TEXT -->

            <div class="post-text">

                <h2>
                    .
                </h2>

                <p>
                    .
                </p>

                <p class="date">
                   .
                </p>

                <span class="read-more">
                    Read More
                </span>

            </div>

        </a>


    </main>


</body>

</html>
