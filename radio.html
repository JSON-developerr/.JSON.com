
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> </title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        display: flex;
        align-items: center;
        gap: 75px;
        padding: 25px;
    }

    .grid {
        display: grid;
        grid-template-columns: 35px repeat(6, 48px);
        column-gap: 15px;
        row-gap: 0;
        align-items: center;
    }

    .header {
        font-size: 27px;
        font-weight: bold;
        text-align: center;
        height: 48px;
    }

    .row-label {
        font-size: 27px;
        text-align: center;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        visibility: hidden;
    }

    .option {
        width: 48px;
        height: 42px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .dot {
        width: 19px;
        height: 19px;
        background: white;
        border-radius: 50%;
        transition: 0.15s;
    }

    .option:hover .dot {
        transform: scale(1.25);
        background: #aaa;
    }

    .option.selected .dot {
        background: #888;
        box-shadow: 0 0 0 3px white;
        transform: scale(0.85);
    }

    /* Visual spacing between row groups */
    .spacer {
        height: 13px;
        grid-column: 1 / -1;
    }

    .submit {
        background: black;
        color: white;
        border: 5px solid white;
        font-size: 27px;
        font-weight: bold;
        padding: 1px 8px;
        cursor: pointer;
        font-family: Arial, sans-serif;
    }

    .submit:hover {
        background: white;
        color: black;
    }

    .message {
        color: white;
        font-size: 15px;
        margin-top: 15px;
        text-align: center;
    }

    @media (max-width: 700px) {
        .container {
            gap: 15px;
            padding: 10px;
            transform: scale(0.85);
        }

        .grid {
            column-gap: 5px;
            grid-template-columns: 25px repeat(6, 38px);
        }

        .option {
            width: 38px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="grid" id="grid">

        <!-- Column headings -->
        <div></div>
        <div class="header">1</div>
        <div class="header">2</div>
        <div class="header">3</div>
        <div class="header">4</div>
        <div class="header">5</div>
        <div class="header">6</div>

    </div>

    <div>
        <button class="submit" onclick="submitCode()">submit</button>
        <div class="message" id="message"></div>
    </div>

</div>

<script>
    const grid = document.getElementById("grid");

    // Selected number for each column
    const selections = [null, null, null, null, null, null];

    // Create the 9 rows and 6 columns
    for (let row = 1; row <= 9; row++) {

        // Invisible row number (keeps spacing)
        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = row;
        grid.appendChild(label);

        // Create 6 options
        for (let col = 1; col <= 6; col++) {

            const option = document.createElement("div");
            option.className = "option";

            const dot = document.createElement("div");
            dot.className = "dot";

            option.appendChild(dot);

            option.onclick = function() {

                // Clear previous selection in this column
                const options = grid.querySelectorAll(
                    `.option[data-col="${col}"]`
                );

                options.forEach(item => {
                    item.classList.remove("selected");
                });

                // Select this option
                option.classList.add("selected");

                // Save the selected row number
                selections[col - 1] = row;
            };

            option.dataset.col = col;
            option.dataset.row = row;

            grid.appendChild(option);
        }

        // Add visual spacing between groups
        if ([3, 5, 7].includes(row)) {
            const spacer = document.createElement("div");
            spacer.className = "spacer";
            grid.appendChild(spacer);
        }
    }

    function submitCode() {

        // Make sure every column has a selection
        if (selections.includes(null)) {
            document.getElementById("message").textContent =
                "Please complete all options.";
            return;
        }

        // Build code from left to right
        const code = selections.join("");

        // Put decimal after the fourth digit
        const formattedCode =
            code.substring(0, 4) + "." + code.substring(4);

        // Correct code
        if (formattedCode === "9127.31") {

            window.location.href =
                "https://json-developerr.github.io/.JSON.com/finale.html";

        } else {

            document.getElementById("message").textContent =
                "Incorrect code.";
        }
    }
</script>

</body>
</html>
